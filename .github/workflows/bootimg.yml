name: bootimg

on:
  workflow_dispatch:
    inputs:
      kernel_run_id:
        description: xnu workflow run id that produced the xnu-kernel artifact
        required: true
      device:
        description: mkadt device profile (sweet / cepheus)
        default: cepheus
      cmdline:
        description: kernel boot-args passed to mkpayload
        default: "debug=0xc serial=3 cpus=6 keepsyms=1 -enable_kprintf_spam -noprogress rd=ufsroot0 unentitled_ios_sim_launch=1 ignition_level=1 wdt_test=no_user_checkin ufsrw=1 rootrw=1 launchd_unsecure_cache=1 wdt=-1 sweetfb_noconsole=1 sweetfb_hz=30"
      early_hang:
        description: "build the shim with EARLY_HANG (beacon that spins in shim_main before any init)"
        default: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Fetch xnu-kernel artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "${{ inputs.kernel_run_id }}" -n xnu-kernel -D out/kernel
          ls -la out/kernel
          file out/kernel/kernel.development.* || true

      - name: Cross toolchain + mkbootimg + avbtool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu cpio
          git clone --depth 1 https://android.googlesource.com/platform/system/tools/mkbootimg out/mkbootimg
          python3 out/mkbootimg/mkbootimg.py --help | head -5
          # cepheus' ABL demands a boot image with an AVB footer (stock and TWRP
          # both carry AVBf/AVB0). On an unlocked device the key is not verified
          # but the structure must be present, so sign with AOSP's test key.
          git clone --depth 1 https://android.googlesource.com/platform/external/avb out/avb
          ls out/avb/test/data/testkey_rsa2048.pem

      # MobileGestalt derives the device identity from /product of the real
      # iPhone X device tree. Fetch just that one 33 KB IPSW member (HTTP range)
      # and unwrap it: DER -> IM4P -> LZFSE -> ADT.
      - name: Fetch the iPhone X device tree
        if: inputs.device != 'sweet'
        run: |
          python3 -m pip install --quiet lzfse
          mkdir -p research/ipsw-x/dt
          python3 tools/remotezip.py \
            "https://updates.cdn-apple.com/2025FallFCS/fullrestores/122-77006/1158E502-D76D-4226-AA06-ED5E30CD1111/iPhone10,3,iPhone10,6_16.7.16_20H392_Restore.ipsw" \
            DeviceTree.d22ap.im4p research/ipsw-x/dt
          python3 tools/im4p_extract.py \
            research/ipsw-x/dt/Firmware/all_flash/DeviceTree.d22ap.im4p \
            research/ipsw-x/d22ap.adt
          ls -la research/ipsw-x/

      - name: Build ADT + payload
        run: |
          python3 tools/mkadt.py out/shuttle.adt --device "${{ inputs.device }}" --highmem
          python3 tools/mkpayload.py out/kernel/kernel.development.sweet out/shuttle.adt out/payload.bin \
            --cmdline '${{ inputs.cmdline }}'
          ls -la out

      - name: Build shim + boot image
        run: |
          chmod +x shim/build.sh
          if [ "${{ inputs.device }}" = "sweet" ]; then
            export HEADER_VERSION=2
          else
            # cepheus: stock boot.img and TWRP are both header v1 with dtb_size 0
            export HEADER_VERSION=1 DTB_ARG= OS_VERSION=11.0.0 OS_PATCH_LEVEL=2021-11 WRAP_UNCOMPRESSED_IMG=1
          fi
          if [ "${{ inputs.early_hang }}" = "true" ]; then
            export EXTRA_CFLAGS="-DEARLY_BEACON"
          fi
          MKBOOTIMG="python3 $PWD/out/mkbootimg/mkbootimg.py" bash shim/build.sh ../out/payload.bin
          ls -la shim/out/
          if [ "${{ inputs.device }}" != "sweet" ]; then
            python3 out/avb/avbtool.py add_hash_footer \
              --image shim/out/shim-boot.img \
              --partition_name boot --partition_size 134217728 \
              --key out/avb/test/data/testkey_rsa2048.pem \
              --algorithm SHA256_RSA2048 --flags 2
            tail -c 64 shim/out/shim-boot.img | xxd | tail -2
            ls -la shim/out/shim-boot.img
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: shim-boot-${{ inputs.device }}
          path: |
            shim/out/shim-boot.img
            out/shuttle.adt
            out/payload.bin
          if-no-files-found: error
